name: Deploy project-1

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: project-1-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Pull and deploy on the application server
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/apps/project-1
          git pull --ff-only origin main
          docker compose config --quiet
          docker compose up -d --build
          docker compose ps
