name: Deploy EFLS Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Node services
        run: |
          for svc in game-core api-gateway realtime worker; do
            docker buildx build \
              --build-arg SERVICE=$svc \
              --tag ${{ secrets.REGISTRY }}/efls/$svc:${{ github.sha }} \
              --tag ${{ secrets.REGISTRY }}/efls/$svc:latest \
              --file infra/docker/node-service.Dockerfile \
              --push .
          done

      - name: Build and push AI service
        run: |
          docker buildx build \
            --tag ${{ secrets.REGISTRY }}/efls/ai:${{ github.sha }} \
            --tag ${{ secrets.REGISTRY }}/efls/ai:latest \
            --file infra/docker/ai.Dockerfile \
            --push .

      - name: Trigger production deploy
        run: |
          curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{\"sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check

  ai-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
