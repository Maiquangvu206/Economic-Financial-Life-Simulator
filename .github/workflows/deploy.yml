name: Deploy project-1

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: project-1-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Pull and deploy on the application server
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/apps/project-1
          previous_revision="$(git rev-parse HEAD)"
          running_postgres_projects="$(docker ps \
            --filter label=com.docker.compose.service=postgres \
            --filter status=running \
            --format '{{.Label "com.docker.compose.project"}}' \
            | sort -u)"
          if [[ -z "$running_postgres_projects" ]]; then
            echo "No running PostgreSQL container found; refusing deployment without a verifiable database backup."
            exit 1
          fi
          if [[ "$running_postgres_projects" == *$'\n'* ]]; then
            echo "Multiple running PostgreSQL Compose projects found; refusing ambiguous deployment."
            printf '%s\n' "$running_postgres_projects"
            exit 1
          fi
          previous_project="$running_postgres_projects"
          git pull --ff-only origin main

          if ! git diff --name-status "$previous_revision" HEAD -- infra/db/migrations \
            | awk '
              $1 == "A" { next }
              $1 == "M" && $2 == "infra/db/migrations/0060_recruitment_job_posting_lifecycle.sql" { next }
              { print; invalid = 1 }
              END { exit invalid }
            '; then
            echo "Only add new migration files; do not edit or delete migrations already present on main."
            exit 1
          fi

          docker compose config --quiet
          target_project="$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          DEPLOY_DB_COMPOSE_PROJECT="$previous_project" bash scripts/backup-production-db.sh
          docker compose build
          docker compose -p "$previous_project" run --rm migrate
          if [[ "$previous_project" != "$target_project" ]]; then
            docker compose -p "$previous_project" down
          fi
          docker compose up -d --build
          web_app_id="$(docker compose ps -q web-app)"
          if [[ -z "$web_app_id" ]]; then
            echo "web-app container was not created."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            web_app_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$web_app_id")"
            if [[ "$web_app_health" == "healthy" ]]; then
              echo "web-app healthcheck passed."
              break
            fi
            if [[ "$web_app_health" == "unhealthy" || "$web_app_health" == "missing" ]]; then
              echo "web-app failed healthcheck (status: $web_app_health)."
              docker compose logs --tail=100 web-app
              exit 1
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Timed out waiting for web-app healthcheck (status: $web_app_health)."
              docker compose logs --tail=100 web-app
              exit 1
            fi
            sleep 2
          done
          docker compose ps
