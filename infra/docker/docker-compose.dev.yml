# docker-compose.dev.yml
# Chạy ở chế độ phát triển: mount source code vào container để tự reload
# khi sửa code. Không cần rebuild image mỗi lần đổi code.
#
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml --env-file .env --profile app up -d --build

name: efls-dev

services:
  game-core:
    profiles: ['app']
    volumes:
      - ./services/game-core/src:/app/src:ro
      - ./packages/contracts/dist:/app/node_modules/@efls/contracts/dist:ro
      - ./packages/domain/dist:/app/node_modules/@efls/domain/dist:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    command: ['node', '--enable-source-maps', 'dist/main.js']
    # Không restart liên tục khi dev, để debug dễ dàng
    restart: 'no'

  api-gateway:
    profiles: ['app']
    volumes:
      - ./services/api-gateway/src:/app/src:ro
      - ./packages/contracts/dist:/app/node_modules/@efls/contracts/dist:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    command: ['node', '--enable-source-maps', 'dist/main.js']
    restart: 'no'

  worker:
    profiles: ['app']
    volumes:
      - ./services/worker/src:/app/src:ro
      - ./packages/contracts/dist:/app/node_modules/@efls/contracts/dist:ro
      - ./packages/domain/dist:/app/node_modules/@efls/domain/dist:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    command: ['node', '--enable-source-maps', 'dist/main.js']
    restart: 'no'

  ai:
    profiles: ['app']
    volumes:
      - ./ai/app:/app/app:ro
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--proxy-headers', '--reload']
    restart: 'no'
