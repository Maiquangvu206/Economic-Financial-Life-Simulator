# EFLS public site (Player + API + Realtime Socket.IO) — serve behind Cloudflare Tunnel
# Replace domains, upstream ports, and dist paths to match your server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream efls_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream efls_realtime {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name play.example.com api.example.com realtime.example.com;

    # If terminating TLS elsewhere (e.g. Cloudflare Tunnel -> HTTP), keep as-is.
    # Otherwise add TLS config here.

    client_max_body_size 10m;

    # Player web (static build)
    root /var/www/efls/apps/web-game/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Socket.IO (realtime)
    location /socket.io/ {
        proxy_pass http://efls_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_socket_keepalive on;
    }

    # Public/API routes (adjust prefix if your gateway expects /api)
    location /api/ {
        proxy_pass http://efls_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
