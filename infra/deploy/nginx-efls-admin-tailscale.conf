# EFLS Admin Portal — PRIVATE (Tailscale only)
# Do NOT expose this server block via Cloudflare Tunnel / public DNS.
# Restrict access to Tailscale CIDR (100.64.0.0/10) as defense-in-depth.

server {
    # Option A: bind to all interfaces but allow only Tailscale range
    listen 80;
    server_name admin.example.com admin-efls.tailnet-name.ts.net;

    allow 100.64.0.0/10;
    deny all;

    root /var/www/efls/apps/admin/dist;
    index index.html;

    client_max_body_size 10m;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy admin API/socket endpoints as needed (ensure upstreams are not publicly exposed)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
