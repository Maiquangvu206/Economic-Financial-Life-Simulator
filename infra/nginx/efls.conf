# EFLS reverse proxy (production-shaped)
#
# Browser -> nginx -> gateway (REST) / realtime (Socket.IO) / static builds.
# TLS is terminated by the platform load balancer; this file is HTTP-only.

upstream gateway_upstream {
  server api-gateway:3000;
}

upstream realtime_upstream {
  server realtime:5000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2m;

  # Player client + admin build (served by a static host in real deployment).
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }

  location /socket.io/ {
    proxy_pass http://realtime_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
